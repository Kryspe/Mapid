<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapid LIVE — Sledování provozu PID (750+ vozidel)</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        :root {
            --bg-dark: #090d16;
            --panel-bg: rgba(15, 23, 42, 0.90);
            --panel-border: rgba(255, 255, 255, 0.12);
            --panel-hover: rgba(255, 255, 255, 0.06);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #3b82f6;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --accent-yellow: #eab308;
            --accent-purple: #a855f7;
            --font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: var(--font-family);
        }

        #map {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* ---------------------------------------------------------------------
           GLASSMORPHISM PANELY
           --------------------------------------------------------------------- */
        .glass-panel {
            position: absolute;
            z-index: 1000;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
        }

        #top-bar {
            top: 20px;
            left: 20px;
            padding: 10px 18px;
            display: flex;
            align-items: center;
            gap: 16px;
            max-width: calc(100vw - 40px);
            overflow-x: auto;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .status-dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--accent-red);
            box-shadow: 0 0 8px var(--accent-red);
            transition: background 0.3s, box-shadow 0.3s;
        }

        .status-badge.online .status-dot {
            background: var(--accent-green);
            box-shadow: 0 0 10px var(--accent-green);
        }

        .divider {
            width: 1px;
            height: 20px;
            background: var(--panel-border);
            flex-shrink: 0;
        }

        #search-input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--panel-border);
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            outline: none;
            font-size: 13px;
            width: 110px;
            transition: width 0.2s;
        }

        #search-input:focus {
            width: 160px;
            border-color: var(--accent-blue);
        }

        #filter-container {
            display: flex;
            gap: 8px;
        }

        .filter-btn {
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-muted);
            border: 1px solid var(--panel-border);
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .filter-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-main);
        }

        .filter-btn.active {
            background: rgba(59, 130, 246, 0.2);
            color: var(--text-main);
            border-color: var(--accent-blue);
        }

        .filter-color-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
        }

        #vehicle-counter {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 600;
            min-width: 90px;
            text-align: right;
            white-space: nowrap;
        }

        #trip-panel {
            top: 20px;
            right: 20px;
            width: 380px;
            max-height: calc(100vh - 120px);
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transform: translateX(40px);
        }

        #trip-panel.open {
            opacity: 1;
            pointer-events: auto;
            transform: translateX(0);
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--panel-border);
        }

        .panel-header h2 {
            margin: 0;
            font-size: 16px;
            font-weight: 700;
            color: var(--text-main);
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 22px;
            cursor: pointer;
            line-height: 1;
            padding: 0;
            transition: color 0.2s;
        }

        .close-btn:hover {
            color: var(--text-main);
        }

        .vehicle-meta-tags {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .meta-tag {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--panel-border);
            border-radius: 6px;
            padding: 3px 8px;
            font-size: 11px;
            color: var(--text-muted);
        }

        #trip-body {
            overflow-y: auto;
            flex-grow: 1;
            padding-right: 4px;
        }

        .stop-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            font-size: 13px;
            border-radius: 6px;
        }

        .stop-row:hover { background: var(--panel-hover); }
        .stop-row.passed { opacity: 0.45; }

        .stop-time { font-weight: 700; width: 50px; }
        .stop-name { flex-grow: 1; margin-left: 8px; }

        .delay-tag {
            background: rgba(239, 68, 68, 0.2);
            color: var(--accent-red);
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 700;
        }

        .bottom-btn {
            position: absolute;
            z-index: 999;
            bottom: 25px;
            background: var(--panel-bg);
            color: var(--text-main);
            border: 1px solid var(--panel-border);
            padding: 12px 22px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .bottom-btn:hover {
            transform: translateY(-2px);
            background: rgba(30, 41, 59, 0.95);
        }

        #disruptions-toggle { left: 20px; }
        #chat-toggle { right: 20px; }

        .badge-count {
            background: var(--accent-red);
            color: white;
            border-radius: 10px;
            padding: 2px 7px;
            font-size: 11px;
            font-weight: 700;
        }

        #disruptions-panel {
            bottom: 85px;
            left: 20px;
            width: 380px;
            max-height: 420px;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transform: translateY(30px);
        }

        #disruptions-panel.open {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }

        .disruption-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--panel-border);
            border-left: 4px solid var(--accent-yellow);
            padding: 12px 14px;
            border-radius: 10px;
            margin-bottom: 10px;
        }

        .disruption-card.severity-high { border-left-color: var(--accent-red); }

        .disruption-title { font-weight: 700; font-size: 14px; margin-bottom: 4px; }
        .disruption-desc { font-size: 12px; color: var(--text-muted); line-height: 1.4; }
        .disruption-lines { display: flex; gap: 4px; margin-top: 8px; flex-wrap: wrap; }
        .line-badge { background: rgba(255,255,255,0.1); padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: 700; }

        #chat-panel {
            bottom: 85px;
            right: 20px;
            width: 380px;
            height: 500px;
            opacity: 0;
            pointer-events: none;
            transform: translateY(30px);
            overflow: hidden;
        }

        #chat-panel.open {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }

        #chat-messages {
            flex-grow: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .chat-bubble {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 13px;
            line-height: 1.45;
        }

        .chat-bubble.user {
            background: var(--accent-blue);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .chat-bubble.model {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-main);
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            border: 1px solid var(--panel-border);
        }

        #chat-form {
            display: flex;
            padding: 12px;
            border-top: 1px solid var(--panel-border);
            gap: 8px;
            background: rgba(0, 0, 0, 0.2);
        }

        #chat-input {
            flex-grow: 1;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--panel-border);
            color: white;
            padding: 10px 14px;
            border-radius: 10px;
            outline: none;
            font-size: 13px;
        }

        /* ---------------------------------------------------------------------
           MARKERY VOZIDEL NA MAPĚ (OPTIMALIZOVÁNO PRO 750+ MARKERŮ)
           --------------------------------------------------------------------- */
        .vehicle-marker {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
            will-change: transform;
        }

        .vehicle-bubble {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 800;
            font-size: 9px;
            border: 1.5px solid #ffffff;
            box-shadow: 0 2px 6px rgba(0,0,0,0.6);
            z-index: 2;
        }

        .vehicle-marker:hover .vehicle-bubble {
            transform: scale(1.3);
            z-index: 99;
        }

        .vehicle-heading {
            position: absolute;
            top: -5px;
            width: 0;
            height: 0;
            border-left: 4px solid transparent;
            border-right: 4px solid transparent;
            border-bottom: 7px solid white;
            z-index: 1;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <div id="top-bar" class="glass-panel">
        <div id="connection-status" class="status-badge">
            <span class="status-dot"></span>
            <span id="status-text">Připojování...</span>
        </div>
        <div class="divider"></div>
        <input type="text" id="search-input" placeholder="Hledat linku..." autocomplete="off" />
        <div class="divider"></div>
        <div id="filter-container"></div>
        <div class="divider"></div>
        <div id="vehicle-counter">0 vozidel</div>
    </div>

    <div id="trip-panel" class="glass-panel">
        <div class="panel-header">
            <h2 id="trip-panel-title">Detail spoje</h2>
            <button class="close-btn" id="trip-panel-close">&times;</button>
        </div>
        <div id="vehicle-tags" class="vehicle-meta-tags"></div>
        <div id="trip-body">Kliknutím na vozidlo zobrazíte detail...</div>
    </div>

    <button id="disruptions-toggle" class="bottom-btn">
        <span>Výluky</span>
        <span id="disruptions-badge" class="badge-count" style="display:none;">0</span>
    </button>

    <button id="chat-toggle" class="bottom-btn">
        <span>Mapid AI Asistent</span>
    </button>

    <div id="disruptions-panel" class="glass-panel">
        <div class="panel-header">
            <h2>Mimořádnosti a výluky PID</h2>
            <button class="close-btn" id="disruptions-close">&times;</button>
        </div>
        <div id="disruptions-body">Načítám výluky...</div>
    </div>

    <div id="chat-panel" class="glass-panel">
        <div class="panel-header" style="margin:0; padding:14px 16px;">
            <h2>Mapid AI Asistent</h2>
            <div style="display:flex; gap:8px; align-items:center;">
                <button id="clear-route-btn" class="filter-btn" style="display:none; padding:3px 8px; font-size:11px; color:var(--accent-red); border-color:var(--accent-red);">Smazat trasu</button>
                <button class="close-btn" id="chat-close">&times;</button>
            </div>
        </div>
        <div id="chat-messages">
            <div class="chat-bubble model">Ahoj! Sleduji přes 750 vozidel PID v reálném čase. Kam potřebuješ jet nebo jakou linku hledáš?</div>
        </div>
        <form id="chat-form">
            <input type="text" id="chat-input" placeholder="Zeptej se na cestu nebo linku..." autocomplete="off" />
            <button type="submit" class="filter-btn active">Odeslat</button>
        </form>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="scriptt.js"></script>
</body>
</html>
